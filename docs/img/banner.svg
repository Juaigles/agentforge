<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="AgentForge: equipos de agentes de IA en tu equipo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#161214"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#dots)"/>

  <!-- Marca -->
  <g transform="translate(72 92)">
    <rect width="56" height="56" rx="14" fill="#c2410c"/>
    <path d="M15.75 38.5l8.75-21 5.25 10.5 3.5-5.25 7 15.75z" fill="#fff"/>
    <circle cx="38.5" cy="17.5" r="3.85" fill="#fed7aa"/>
  </g>
  <text x="146" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#f4f4f5" letter-spacing="-1">Agent<tspan fill="url(#hot)">Forge</tspan></text>
  <text x="74" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#a1a1aa">Monta un equipo de agentes de IA, conéctalos en un diagrama</text>
  <text x="74" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#a1a1aa">y míralos trabajar paso a paso. Todo en tu ordenador.</text>
  <text x="74" y="272" font-family="Consolas, Menlo, monospace" font-size="16" fill="#71717a">Ollama · OpenAI-compatible · Vue 3 · Fastify · SQLite · MIT</text>

  <!-- Workflow de ejemplo: frío = pendiente, al rojo = en curso, temple = hecho -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <circle cx="1040" cy="160" r="120" fill="url(#glow)"/>
    <g fill="none" stroke-width="2.2">
      <path d="M842 160 C 872 160, 872 104, 902 104" stroke="#60a5fa"/>
      <path d="M842 160 C 872 160, 872 216, 902 216" stroke="#60a5fa"/>
      <path d="M1000 104 C 1030 104, 1030 160, 1060 160" stroke="#f97316"/>
      <path d="M1000 216 C 1030 216, 1030 160, 1060 160" stroke="#f97316"/>
      <path d="M1158 160 L 1190 160" stroke="#3f3f46" stroke-dasharray="5 5"/>
    </g>
    <g>
      <rect x="744" y="138" width="98" height="44" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="1.6"/>
      <text x="793" y="165" text-anchor="middle" fill="#bfdbfe">Tema</text>
      <rect x="902" y="82" width="98" height="44" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="1.6"/>
      <text x="951" y="109" text-anchor="middle" fill="#bfdbfe">Investigar</text>
      <rect x="902" y="194" width="98" height="44" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="1.6"/>
      <text x="951" y="221" text-anchor="middle" fill="#bfdbfe">Analizar</text>
      <rect x="1060" y="138" width="98" height="44" rx="10" fill="#2a1306" stroke="#f97316" stroke-width="2"/>
      <text x="1109" y="165" text-anchor="middle" fill="#fed7aa">Redactar</text>
      <rect x="1190" y="138" width="60" height="44" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.6"/>
      <text x="1220" y="165" text-anchor="middle" fill="#71717a">…</text>
    </g>
  </g>
</svg>
